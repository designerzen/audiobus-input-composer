<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111319">
    <meta name="description" content="Every genre and emotion of the AudioBus Composer, side by side, with musical measures and audition.">
    <title>Composer Gallery</title>
    <style>
      :root{--bg:#111319;--panel:#181b23;--line:#2a2e3a;--text:#f0eee6;--muted:#a8adb8;--accent:#d0e9aa}
      *{box-sizing:border-box}body{color:var(--text);background:var(--bg);margin:0;font-family:system-ui,-apple-system,sans-serif}
      main{max-width:1160px;margin:auto;padding:44px 28px 32px}
      .kicker{letter-spacing:.19em;text-transform:uppercase;color:var(--muted);font-size:10px}
      h1{letter-spacing:-.03em;margin:12px 0 8px;font:clamp(30px,4vw,46px)/1.1 Georgia,serif}h1 em{color:var(--accent);font-weight:400}
      p{color:var(--muted);font-size:13px;line-height:1.7;max-width:640px}
      a{color:#bfc9b4}
      .controls{display:flex;flex-wrap:wrap;gap:16px;align-items:end;margin:24px 0}
      label{display:grid;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
      select,input[type=range]{min-height:36px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;font-size:14px;text-transform:none;letter-spacing:0}
      .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
      .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px}
      .card header{display:flex;justify-content:space-between;align-items:center;gap:8px}
      .card h2{font-size:15px;margin:0;font-weight:600}.card .sub{font-size:11px;color:var(--muted)}
      .card svg{width:100%;height:auto;background:#12141b;border-radius:6px}
      .chords{font-size:11px;color:var(--muted);line-height:1.5;word-spacing:4px}
      dl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:0;font-size:12px}dt{color:var(--muted)}dd{margin:0;font-variant-numeric:tabular-nums;text-align:right}
      button{min-height:34px;border-radius:8px;border:1px solid var(--line);background:#222633;color:var(--text);font:inherit;font-size:13px;padding:0 12px;cursor:pointer;white-space:nowrap}
      button[aria-pressed=true]{background:var(--accent);color:#111319;border-color:var(--accent)}
      button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
      .table-wrap{overflow-x:auto;margin-top:36px}
      table{border-collapse:collapse;width:100%;font-size:12px;font-variant-numeric:tabular-nums}
      th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
      th{color:var(--muted);font-weight:500}
      @media (max-width:700px){main{padding:28px 16px}}
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">AudioBus Composer / Gallery</div>
      <h1>Every idiom, <em>side by side.</em></h1>
      <p>Thirty-two bars for each emotion in the chosen genre, with the measures the tests hold the generator to. Play any card to hear it in the browser. <a href="./">Back to the instrument</a></p>
      <div class="controls">
        <label>Genre<select id="genre"></select></label>
        <label>Energy<input id="energy" type="range" min="0" max="1" step="0.05" value="0.6"></label>
        <label>Seed<select id="seed"><option>gallery</option><option>second</option><option>third</option></select></label>
      </div>
      <div class="grid" id="cards" aria-live="polite"></div>
      <div class="table-wrap"><table id="summary"><caption class="kicker" style="text-align:left;padding-bottom:10px">All genres, averaged over the eight emotions</caption></table></div>
    </main>
    <script type="module" src="/demo/gallery.ts"></script>
  </body>
</html>
